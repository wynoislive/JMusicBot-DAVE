name: Build and Release JMusicBot-DAVE

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Shaded JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests --batch-mode

      - name: Verify and Prepare Artifacts
        run: |
          ls -la target/
          cp target/JMusicBot.jar ./JMusicBot.jar
          sha256sum JMusicBot.jar > JMusicBot.jar.sha256
          echo "SHA256: $(cat JMusicBot.jar.sha256)"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JMusicBot.jar
            JMusicBot.jar.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          name: JMusicBot-DAVE ${{ github.ref_name }}
          body: |
            ### JMusicBot-DAVE Release
            Stand-alone Discord music bot with Discord DAVE E2EE voice protocol support and YouTube TV OAuth device login.

            #### Features in this release:
            - **Discord Voice DAVE E2EE**: Native MLS encryption via `libdave-jvm` + JDA 6.3.2 (zero voice reconnect loops).
            - **YouTube TV OAuth 2.0**: Device authorization flow with automatic refresh token persistence to `youtube_oauth_token.txt`.
            - **Ultra-Low Memory**: `NonAllocatingAudioFrameBuffer` optimized for `-XX:+UseSerialGC -Xms64M -Xmx256M`.
            - **Pelican / Pterodactyl Compatible**: Drop-in replacement for classic JMusicBot eggs.
